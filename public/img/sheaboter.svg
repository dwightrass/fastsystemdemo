<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 640" role="img" aria-label="Pot Natural Pure sheaboter met houten deksel">
  <defs>
    <!-- Houten deksel -->
    <linearGradient id="wood" x1="0" x2="1">
      <stop offset="0" stop-color="#5e4129"/>
      <stop offset=".18" stop-color="#8a6342"/>
      <stop offset=".45" stop-color="#a87d55"/>
      <stop offset=".7" stop-color="#8f6744"/>
      <stop offset="1" stop-color="#4f3622"/>
    </linearGradient>
    <linearGradient id="woodTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b98d63"/>
      <stop offset="1" stop-color="#8d6643"/>
    </linearGradient>
    <pattern id="grain" width="600" height="40" patternUnits="userSpaceOnUse">
      <path d="M0 8 C120 4 240 12 360 7 S540 10 600 6" stroke="#3e2a18" stroke-opacity=".18" stroke-width="1.2" fill="none"/>
      <path d="M0 22 C100 26 260 18 380 23 S520 20 600 24" stroke="#3e2a18" stroke-opacity=".14" stroke-width="1" fill="none"/>
      <path d="M0 33 C150 30 250 36 400 32 S560 35 600 33" stroke="#f3dcc0" stroke-opacity=".12" stroke-width="1" fill="none"/>
    </pattern>
    <!-- Matglazen pot -->
    <linearGradient id="jar" x1="0" x2="1">
      <stop offset="0" stop-color="#cfc6b5"/>
      <stop offset=".12" stop-color="#ece6da"/>
      <stop offset=".35" stop-color="#faf7f1"/>
      <stop offset=".62" stop-color="#f1ebe0"/>
      <stop offset=".88" stop-color="#d9d0bf"/>
      <stop offset="1" stop-color="#bdb3a0"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" x2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".75"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="label" x1="0" x2="1">
      <stop offset="0" stop-color="#d9ccb2"/>
      <stop offset=".25" stop-color="#efe5d1"/>
      <stop offset=".6" stop-color="#ebe0ca"/>
      <stop offset="1" stop-color="#c9bb9f"/>
    </linearGradient>
    <radialGradient id="shadow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#3b3020" stop-opacity=".35"/>
      <stop offset="1" stop-color="#3b3020" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>

  <!-- Schaduw -->
  <ellipse cx="300" cy="586" rx="210" ry="26" fill="url(#shadow)"/>

  <!-- Pot -->
  <path d="M118 238 h364 a10 10 0 0 1 10 10 v300 c0 22 -18 38 -40 38 h-304 c-22 0 -40 -16 -40 -38 v-300 a10 10 0 0 1 10 -10z" fill="url(#jar)"/>
  <ellipse cx="300" cy="580" rx="186" ry="6" fill="#a99e8a" opacity=".35"/>
  <!-- glans -->
  <rect x="150" y="250" width="26" height="320" rx="13" fill="url(#shine)" opacity=".8" filter="url(#soft)"/>
  <rect x="440" y="260" width="10" height="300" rx="5" fill="url(#shine)" opacity=".45" filter="url(#soft)"/>

  <!-- Etiket -->
  <path d="M108 318 h384 v190 h-384z" fill="url(#label)"/>
  <path d="M108 318 h384" stroke="#b7a786" stroke-opacity=".6"/>
  <path d="M108 508 h384" stroke="#b7a786" stroke-opacity=".6"/>
  <g font-family="'Cormorant Garamond', Georgia, serif" text-anchor="middle" fill="#3d3324">
    <text x="300" y="352" font-size="13" letter-spacing="5" fill="#7a6a4e" font-family="Jost, Helvetica, Arial, sans-serif">NATURAL PURE</text>
    <path d="M286 380 c8 -10 20 -13 30 -11 c-4 10 -16 15 -30 11z M286 380 c9 -5 18 -8 26 -10" stroke="#5c6b43" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M240 375 h36 M324 375 h36" stroke="#b7a786" stroke-width="1"/>
    <text x="300" y="430" font-size="50" font-style="italic">Shea Butter</text>
    <text x="300" y="460" font-size="12" letter-spacing="4" fill="#7a6a4e" font-family="Jost, Helvetica, Arial, sans-serif">RAUW · ONGERAFFINEERD</text>
    <text x="300" y="490" font-size="12" letter-spacing="2" fill="#9a8a6c" font-family="Jost, Helvetica, Arial, sans-serif">200 ml · 6.8 fl oz</text>
  </g>

  <!-- Deksel -->
  <path d="M104 150 h392 a14 14 0 0 1 14 14 v66 a14 14 0 0 1 -14 14 h-392 a14 14 0 0 1 -14 -14 v-66 a14 14 0 0 1 14 -14z" fill="url(#wood)"/>
  <path d="M104 150 h392 a14 14 0 0 1 14 14 v66 a14 14 0 0 1 -14 14 h-392 a14 14 0 0 1 -14 -14 v-66 a14 14 0 0 1 14 -14z" fill="url(#grain)"/>
  <path d="M104 150 h392 a14 14 0 0 1 14 14 v6 h-420 v-6 a14 14 0 0 1 14 -14z" fill="url(#woodTop)" opacity=".7"/>
  <rect x="96" y="232" width="408" height="6" rx="3" fill="#3e2a18" opacity=".35"/>
  <rect x="140" y="160" width="140" height="4" rx="2" fill="#fff" opacity=".18"/>
</svg>
